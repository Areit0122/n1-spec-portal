name: Classify TS 24.501 and publish portal

on:
  push:
    paths:
      - "spec-source/24.501/**"
      - "spec-source/24.008/**"
      - "tools/classify_spec.py"
      - "docs/spec/index.md"
      - "docusaurus.config.js"
      - "sidebars.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/update-spec.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python tools/classify_spec.py
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://areit0122.github.io
          BASE_URL: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
  deploy:
    if: github.repository == 'Areit0122/n1-spec-portal'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
